<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#050505" />
    <title>UROBOROS — Hola mundo</title>
    <style>
      :root {
        color-scheme: dark;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: #050505;
        color: #f5f5f2;
      }

      * { box-sizing: border-box; }

      body {
        margin: 0;
        min-height: 100svh;
        display: grid;
        place-items: center;
        overflow: hidden;
        background:
          radial-gradient(circle at 50% 45%, rgba(255, 255, 255, 0.09), transparent 18rem),
          #050505;
      }

      main {
        width: min(90vw, 72rem);
        padding: 3rem;
        text-align: center;
      }

      .mark {
        width: 0.75rem;
        height: 0.75rem;
        margin: 0 auto 3rem;
        border-radius: 999px;
        background: #fff;
        box-shadow: 0 0 2rem rgba(255, 255, 255, 0.8);
      }

      p {
        margin: 0 0 1rem;
        color: #8d8d88;
        font-size: 0.72rem;
        letter-spacing: 0.28em;
        text-transform: uppercase;
      }

      h1 {
        margin: 0;
        font-size: clamp(3.5rem, 12vw, 10rem);
        font-weight: 400;
        line-height: 0.92;
        letter-spacing: -0.065em;
      }
    </style>
  </head>
  <body>
    <main>
      <div class="mark" aria-hidden="true"></div>
      <p>Proyecto UROBOROS · v0.1.1</p>
      <h1>Hola mundo.</h1>
    </main>
  </body>
</html>
